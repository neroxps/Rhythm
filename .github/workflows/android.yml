name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lint
      
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: app/build/reports/lint-results*.html
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (debug flavor)
        run: ./gradlew testGithubDebugUnitTest

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-results
          path: |
            app/build/reports/tests/*
            app/build/test-results/*
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: 'zulu'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create files for signing (fixed key so test APKs can be upgraded in place)
      env:
        SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
        PRIVATE_PROPERTIES: ${{ secrets.PRIVATE_PROPERTIES }}
      run: |
        mkdir -p config/signing
        mkdir -p .config
        # Decode keystore and signing property files if secrets are available
        if [ -n "$SIGNING_KEYSTORE" ]; then
          printf '%s' "$SIGNING_KEYSTORE" | base64 -di > ./config/signing/rhythm_keystore.jks
        fi
        if [ -n "$SIGNING_PROPERTIES" ]; then
          printf '%s' "$SIGNING_PROPERTIES" | base64 -di > ./.config/keystore.properties
        fi
        if [ -n "$PRIVATE_PROPERTIES" ]; then
          printf '%s' "$PRIVATE_PROPERTIES" | base64 -di > ./config/signing/private.properties
        else
          touch ./config/signing/private.properties
        fi

    - name: Build with Gradle (GitHub flavor only)
      env:
        APPLE_MUSIC_FALLBACK_TOKEN: ${{ secrets.APPLE_MUSIC_FALLBACK_TOKEN }}
      run: |
        # GitHub flavor: full ABI matrix + universal (release distribution).
        ./gradlew assembleGithubRelease assembleGithubDebug
        # Beta flavor: arm64-v8a only (test build for the user's device) - much smaller artifact.
        ./gradlew assembleBetaRelease -Pnightly=true

    - name: Generate build info
      if: github.event_name == 'pull_request'
      run: |
        echo "Build completed at: $(date)" > build_info.txt
        echo "Commit: ${{ github.sha }}" >> build_info.txt
        echo "Branch: ${{ github.head_ref }}" >> build_info.txt

    - name: Upload PR artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: rhythm-pr-${{ github.event.pull_request.number }}
        path: |
          app/build/outputs/apk/github/release/*.apk
          app/build/outputs/apk/github/debug/*.apk
          app/build/outputs/apk/beta/release/*.apk
          build_info.txt
        retention-days: 14